name: CI (Release)
on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    outputs:
      artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '6.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Publish (Self-Contained)
      run: dotnet publish -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }} -r win-x64 -c Release --self-contained true -o publish-selfcontained .\Bloxstrap\Bloxstrap.csproj

    - name: Publish (Framework-Dependent)
      run: dotnet publish -p:PublishSingleFile=true -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }} -r win-x64 -c Release --self-contained false -o publish .\Bloxstrap\Bloxstrap.csproj

    - name: Upload Artifact
      id: upload-artifact
      uses: actions/upload-artifact@v7
      with:
        name: Bloxstrap (Release) (${{ github.sha }})
        path: publish\*

    - name: Upload Self-Contained Artifact
      uses: actions/upload-artifact@v7
      with:
        name: BloxstrapGold-SelfContained (${{ github.sha }})
        path: publish-selfcontained\*

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v7
        with:
          name: Bloxstrap (Release) (${{ github.sha }})
          path: publish

      - name: Download Self-Contained Artifact
        uses: actions/download-artifact@v7
        with:
          name: BloxstrapGold-SelfContained (${{ github.sha }})
          path: publish-selfcontained

      - name: Prepare Binaries
        shell: pwsh
        run: |
          Copy-Item "publish-selfcontained\Bloxstrap.exe" "BloxstrapGold.exe"
          Copy-Item "publish-selfcontained\Bloxstrap.exe" "BloxstrapGold-Setup.exe"
          Copy-Item "publish\Bloxstrap.exe" "Bloxstrap.exe"
          Compress-Archive -Path "publish-selfcontained\Bloxstrap.exe" -DestinationPath "BloxstrapGold-Windows.zip"
          Compress-Archive -Path "publish\Bloxstrap.exe" -DestinationPath "Bloxstrap-${{ github.ref_name }}-Windows.zip"

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: |
            BloxstrapGold.exe
            BloxstrapGold-Setup.exe
            BloxstrapGold-Windows.zip
            Bloxstrap.exe
            Bloxstrap-${{ github.ref_name }}-Windows.zip
          name: Bloxstrap Gold ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-test:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/release-test')

    steps:
      - name: Sign and download artifact
        uses: signpath/github-action-submit-signing-request@v2.0
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '107b3de5-057b-42fc-a985-3546e4261775'
          project-slug: 'bloxstrap'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'github-ci'
          github-artifact-id: '${{ needs.build.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'release'

      - name: Rename binaries
        run: mv release/Bloxstrap.exe Bloxstrap-${{ github.ref_name }}.exe

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: Bloxstrap-${{ github.ref_name }}.exe
          name: Bloxstrap ${{ github.ref_name }}
