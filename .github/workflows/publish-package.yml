name: Publish GitHub Package (NuGet)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-package:
    runs-on: windows-latest

    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore dependencies
        run: dotnet restore Bloxstrap\Bloxstrap.csproj

      - name: Build Project
        run: dotnet build -c Release --no-restore Bloxstrap\Bloxstrap.csproj

      - name: Pack NuGet Package
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if (-not $ver) { $ver = "2.11.5" }
          dotnet pack Bloxstrap\Bloxstrap.csproj -c Release --no-build -p:PackageVersion=$ver -p:PackageId=BloxstrapGold -p:Authors="Bloxstrap Gold" -p:Company="Bloxstrap Gold" -p:Description="Bloxstrap Gold - Luxury Roblox bootstrapper with RAM multi-instance engine" -p:RepositoryUrl="https://github.com/Bloxstrap-Gold/Bloxstrap-Gold" -o out

      - name: Push to GitHub Packages
        run: |
          dotnet nuget add source --username "${{ github.repository_owner }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text --name "github" "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          dotnet nuget push out\*.nupkg --api-key "${{ secrets.GITHUB_TOKEN }}" --source "github" --skip-duplicate
