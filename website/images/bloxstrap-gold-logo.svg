<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="540" height="120" fill="none">
  <defs>
    <!-- Gold Gradient Defs -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="25%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="75%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="goldGleam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="50%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="crownGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Crown Icon on top of emblem -->
  <g transform="translate(18, 14)">
    <!-- Bloxstrap Rhombus / Cube tilted emblem -->
    <path d="M42 22 L72 39.3 L72 74 L42 91.3 L12 74 L12 39.3 Z" fill="#18181B" stroke="url(#goldLinear)" stroke-width="3.5" filter="url(#goldGlow)"/>
    <path d="M42 32 L62 43.5 L62 66.5 L42 78 L22 66.5 L22 43.5 Z" fill="url(#goldLinear)" opacity="0.95"/>
    <path d="M42 42 L52 47.7 L52 59.3 L42 65 L32 59.3 L32 47.7 Z" fill="#09090B"/>
    
    <!-- Mini Crown above emblem -->
    <path d="M26 12 L32 20 L42 8 L52 20 L58 12 L56 24 L28 24 Z" fill="url(#crownGold)" stroke="#B45309" stroke-width="1"/>
    <circle cx="26" cy="11" r="2" fill="#FFFBEB"/>
    <circle cx="42" cy="7" r="2.5" fill="#FFFBEB"/>
    <circle cx="58" cy="11" r="2" fill="#FFFBEB"/>
  </g>

  <!-- Bloxstrap Text -->
  <text x="115" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    Bloxstrap
  </text>

  <!-- GOLD Badge / Text -->
  <g transform="translate(345, 34)">
    <rect x="0" y="0" width="112" height="42" rx="8" fill="url(#goldLinear)" stroke="#FDE68A" stroke-width="1.5" filter="url(#goldGlow)"/>
    <text x="56" y="29" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#09090B" text-anchor="middle" letter-spacing="2.5">
      GOLD
    </text>
  </g>
</svg>
